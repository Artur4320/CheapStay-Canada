name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare persistent signing (if configured)
        if: ${{ secrets.EASYWAY_KEYSTORE_BASE64 != '' }}
        run: echo "$EASYWAY_KEYSTORE_BASE64" | base64 --decode > easyway-keystore.jks
        env:
          EASYWAY_KEYSTORE_BASE64: ${{ secrets.EASYWAY_KEYSTORE_BASE64 }}
      - name: Build debug APK
        run: gradle assembleDebug
        env:
          EASYWAY_KEYSTORE_PATH: ${{ secrets.EASYWAY_KEYSTORE_BASE64 != '' && 'easyway-keystore.jks' || '' }}
          EASYWAY_STORE_PASSWORD: ${{ secrets.EASYWAY_STORE_PASSWORD }}
          EASYWAY_KEY_ALIAS: ${{ secrets.EASYWAY_KEY_ALIAS }}
          EASYWAY_KEY_PASSWORD: ${{ secrets.EASYWAY_KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyWay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
